<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>手入力検品</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { 
  font-family: -apple-system, BlinkMacSystemFont; 
  padding: 20px; background:#ffffff; 
  margin-bottom: 90px;
}

#status { padding: 20px; font-size: 22px; font-weight: bold; border-radius: 10px; text-align: center; margin-bottom: 20px; }
.ok { background: green; color: white; }
.ng { background: red; color: white; }
.normal { background: #e5e5e5; color: #0066cc; }

input { width: 90%; font-size: 24px; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #888; }
button { width: 100%; font-size: 20px; padding: 15px; margin-top: 10px; border-radius: 10px; }

table { width: 100%; margin-top: 20px; border-collapse: collapse; background:white; }
th, td { border-bottom: 1px solid #ddd; padding: 6px; }

#video-container { position: relative; width: 100%; max-width: 400px; margin: auto; }
video { width: 100%; border-radius: 10px; }

#scan-frame {
  width: 220px;
  height: 220px;
  border: 3px solid rgba(255,0,0,0.8);
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  border-radius: 10px;
}

.navbar {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#f3f3f3;
  border-top:2px solid #ccc;
  display:flex;
  justify-content:space-around;
}
.navbar a {
  flex:1;
  text-align:center;
  padding:15px 0;
  text-decoration:none;
  color:#333;
}
.navbar a.active {
  background:#0078ff;
  color:white;
  font-weight:bold;
}

body { overflow-x: hidden; }

#history {
  width: 100%;
  max-width: 100%;
  table-layout: fixed;
}
#history th,
#history td {
  max-width: 0;
  word-break: break-all;
  overflow-wrap: anywhere;
  white-space: normal;
  overflow: hidden;
}
#history th:nth-child(3),
#history td:nth-child(3) {
  font-size: 12px;
  line-height: 1.3;
}
#history td:nth-child(3) {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
</style>
</head>

<body>

<h2>手入力検品システム</h2>

<div id="status" class="normal">① 最初に品番・型式を手入力してください</div>
<input id="manualInput" type="text" placeholder="例：ABC123" maxlength="50">

<div id="video-container">
  <video id="camera" autoplay playsinline></video>
  <div id="scan-frame"></div>
</div>

<button id="startScanBtn">📷 QRコードを読み取る</button>
<button id="resetBtn">🔄 最初に戻る</button>
<button id="exportBtn">📁 CSV出力</button>

<h3>履歴</h3>
<table id="history"></table>

<div class="navbar">
  <a href="index.html">📷 QR検品</a>
  <a href="tenyuryoku.html" class="active">⌨ 手入力検品</a>
  <a href="scan.html">🏷️ 海外ラベル</a>
  <a href="gennpin.html">🎟️ 現品票検品</a>
</div>

<script src="js/jsQR.js"></script>

<script>
// ========= 検品用変数 =========
let firstInput = "";
let scanning = false;
let detected = false;

/* ========= AudioContext（Android完全対策） ========= */
let audioCtx;
let soundBuffers = {};
let audioReady = false;

async function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }

  const files = {
    ok: "sounds/seikou.mp3",
    ng: "sounds/keikoku.mp3"
  };

  for (const k in files) {
    const res = await fetch(files[k]);
    const buf = await res.arrayBuffer();
    soundBuffers[k] = await audioCtx.decodeAudioData(buf);
  }

  audioReady = true;
}

function playSound(type) {
  if (!audioReady || !soundBuffers[type]) return;
  const src = audioCtx.createBufferSource();
  src.buffer = soundBuffers[type];
  src.connect(audioCtx.destination);
  src.start(0);
}

/* ========= IndexedDB ========= */
let db;
const req = indexedDB.open("QR_Inspection_DB", 1);

req.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("records", { keyPath: "id", autoIncrement: true });
};
req.onsuccess = e => {
  db = e.target.result;
  loadHistory();
};

function saveResult(first, scanned, result) {
  const tx = db.transaction("records", "readwrite");
  tx.objectStore("records").add({
    time: new Date().toLocaleString(),
    first,
    scanned,
    result
  });
  setTimeout(loadHistory, 300);
}

/* ========= UI ========= */
function setStatus(text, type="normal") {
  const s = document.getElementById("status");
  s.textContent = text;
  s.className = type;
}

/* ========= カメラ ========= */
const video = document.getElementById("camera");

async function startScan() {
  if (!firstInput) return alert("先に手入力してください");

  await initAudio(); // ★ ユーザー操作時に必ず音を復帰

  if (scanning) return;
  scanning = true;
  detected = false;

  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "environment" },
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      advanced: [{ zoom: 2 }]
    }
  });

  video.srcObject = stream;
  setStatus("枠内にQRコードを合わせてください","normal");
  requestAnimationFrame(scanLoop);
}

function stopCamera() {
  scanning = false;
  if (video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  video.srcObject = null;
}

/* ========= QR処理 ========= */
function scanLoop() {
  if (!scanning || detected) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const frame = document.getElementById("scan-frame").getBoundingClientRect();
  const rect = video.getBoundingClientRect();

  canvas.width = frame.width;
  canvas.height = frame.height;

  const scaleX = video.videoWidth / rect.width;
  const scaleY = video.videoHeight / rect.height;

  ctx.drawImage(video,
    (frame.left - rect.left) * scaleX,
    (frame.top - rect.top) * scaleY,
    frame.width * scaleX,
    frame.height * scaleY,
    0,0,canvas.width,canvas.height
  );

  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const qr = jsQR(img.data, canvas.width, canvas.height);

  if (qr) {
    detected = true;
    stopCamera();
    compare(qr.data);
  } else {
    requestAnimationFrame(scanLoop);
  }
}

/* ========= 判定 ========= */
function compare(scanned) {
  if (scanned.includes(firstInput)) {
    setStatus("✔ 一致しました！", "ok");
    playSound("ok");
    saveResult(firstInput, scanned, "OK");
  } else {
    setStatus("❌ 不一致です", "ng");
    playSound("ng");
    saveResult(firstInput, scanned, "NG");
  }
}

/* ========= 入力制御 ========= */
document.getElementById("manualInput").addEventListener("input", e => {
  let v = e.target.value;

  if (/[^\x20-\x7E]/.test(v)) {
    setStatus("❌ 全角は使用できません", "ng");
    firstInput = "";
    return;
  }
  if (/[a-z]/.test(v)) {
    setStatus("❌ 小文字は使用できません", "ng");
    firstInput = "";
    return;
  }
  if (v.length < 6) {
    setStatus("❌ 半角6文字以上入力してください", "ng");
    firstInput = "";
    return;
  }

  firstInput = v;
  setStatus("次にQRコードを読み取ってください","normal");
});

/* ========= 履歴 ========= */
function loadHistory() {
  const tx = db.transaction("records","readonly");
  const req = tx.objectStore("records").getAll();

  req.onsuccess = () => {
    const table = document.getElementById("history");
    table.innerHTML = "<tr><th>時刻</th><th>入力</th><th>QR</th><th>結果</th></tr>";
    req.result.reverse().slice(0,5).forEach(r=>{
      table.innerHTML += `<tr><td>${r.time}</td><td>${r.first}</td><td>${r.scanned}</td><td>${r.result}</td></tr>`;
    });
  };
}

/* ========= CSV ========= */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const tx = db.transaction("records","readonly");
  const req = tx.objectStore("records").getAll();
  req.onsuccess = ()=>{
    const rows=[["時刻","入力値","QR値","結果"], ...req.result.map(r=>[r.time,r.first,r.scanned,r.result])];
    const blob = new Blob([rows.join("\n")],{type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "検品結果.csv";
    a.click();
  };
});

/* ========= ボタン ========= */
document.getElementById("startScanBtn").addEventListener("click", startScan);
document.getElementById("resetBtn").addEventListener("click", resetAll);

function resetAll() {
  stopCamera();
  firstInput = "";
  scanning = false;
  detected = false;
  document.getElementById("manualInput").value = "";
  setStatus("① 最初に品番・型式を手入力してください", "normal");
}

/* ========= スリープ復帰対策 ========= */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    audioReady = false;
    await initAudio();
  }
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
