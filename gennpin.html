
<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="icon/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta charset="UTF-8">
<title>現品票検品</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
  margin: 0 0 80px;
  background-color: #ffe4e9;
}

#status {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 20px;
}

.ok {
  background: green;
  color: white;
}

.ng {
  background: red;
  color: white;
}

.normal {
  background: #e5e5e5;
  color: #0066cc;
}

button {
  width: 100%;
  font-size: 20px;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
  table-layout: fixed;
}

th, td {
  border-bottom: 1px solid #ddd;
  padding: 6px;
  word-break: break-all;
  overflow-wrap: anywhere;
  font-size: 12px;
}

#video-container {
  position: relative;
  width: 100%;
  max-width: 400px;
  margin: auto;
}

video {
  display: block;
  width: 100%;
  border-radius: 10px;
}

#scan-frame {
  width: 220px;
  height: 220px;
  max-width: 70%;
  max-height: 70%;
  box-sizing: border-box;
  border: 3px solid rgba(255, 0, 0, 0.8);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  border-radius: 10px;
}

.info-box {
  margin-top: 15px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 10px;
  font-size: 14px;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.navbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #f3f3f3;
  border-top: 2px solid #ccc;
  display: flex;
  justify-content: space-around;
  z-index: 10;
}

.navbar a {
  flex: 1;
  text-align: center;
  padding: 15px 0;
  font-size: 12px;
  text-decoration: none;
  color: #333;
}

.navbar a.active {
  background: #0078ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>現品票検品</h2>

<div id="status" class="normal">
  1枚目のQRコードを読み込んでください
</div>

<div id="video-container">
  <video id="v" autoplay playsinline></video>
  <div id="scan-frame"></div>
</div>

<div class="info-box">
  <div><b>1枚目:</b> <span id="firstDisplay">未読込</span></div>
  <div><b>2枚目:</b> <span id="secondDisplay">未読込</span></div>
</div>

<button id="scanBtn">📷 QRコードを読み取る</button>
<button id="resetBtn">🔄 最初に戻る</button>
<button id="exportBtn">📁 CSV出力</button>

<h3>履歴</h3>

<table id="history">
  <tr>
    <th>時刻</th>
    <th>1枚目</th>
    <th>2枚目</th>
    <th>結果</th>
  </tr>
</table>

<div class="navbar">
  <a href="index.html">📷 QR検品</a>
  <a href="tenyuryoku.html">⌨ 手入力検品</a>
  <a href="scan.html">🏷️ 海外ラベル</a>
  <a href="gennpin.html" class="active">🎟️ 現品票検品</a>
</div>

<script src="js/jsQR.js"></script>

<script>
/* ===== 状態管理 ===== */
let step = 1;
let firstCode = "";
let secondCode = "";

let scanning = false;
let detected = false;
let scanStarting = false;

/* ===== Audio ===== */
let audioCtx;
let soundBuffers = {};
let audioReady = false;
let audioInitPromise = null;

async function initAudio() {
  if (audioInitPromise) {
    return audioInitPromise;
  }

  audioInitPromise = (async () => {
    if (!audioCtx) {
      audioCtx = new (
        window.AudioContext || window.webkitAudioContext
      )();
    }

    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }

    const files = {
      read: "sounds/yomitori.mp3",
      success: "sounds/seikou.mp3",
      error: "sounds/keikoku.mp3"
    };

    for (const key of Object.keys(files)) {
      if (soundBuffers[key]) continue;

      const response = await fetch(files[key]);

      if (!response.ok) {
        throw new Error(
          "音声ファイルを読み込めません: " + files[key]
        );
      }

      const arrayBuffer = await response.arrayBuffer();

      soundBuffers[key] =
        await audioCtx.decodeAudioData(arrayBuffer);
    }

    audioReady = true;
  })();

  try {
    await audioInitPromise;
  } catch (err) {
    audioReady = false;
    console.error("音声初期化エラー:", err);
    throw err;
  } finally {
    audioInitPromise = null;
  }
}

function playSound(type) {
  if (!audioReady || !audioCtx || !soundBuffers[type]) {
    return;
  }

  const source = audioCtx.createBufferSource();
  source.buffer = soundBuffers[type];
  source.connect(audioCtx.destination);
  source.start(0);
}

/* ===== IndexedDB ===== */
let db;
let dbReady = false;

const dbPromise = new Promise((resolve, reject) => {
  const request = indexedDB.open("checksDB", 1);

  request.onupgradeneeded = event => {
    const database = event.target.result;

    if (!database.objectStoreNames.contains("checks")) {
      database.createObjectStore("checks", {
        keyPath: "id",
        autoIncrement: true
      });
    }
  };

  request.onsuccess = event => {
    db = event.target.result;
    dbReady = true;

    db.onversionchange = () => {
      db.close();
      dbReady = false;
    };

    loadHistory().catch(console.error);
    resolve(db);
  };

  request.onerror = () => {
    reject(request.error);
  };
});

/* ===== UI ===== */
function setStatus(text, type = "normal") {
  const status = document.getElementById("status");
  status.textContent = text;
  status.className = type;
}

function updateDisplay() {
  document.getElementById("firstDisplay").textContent =
    firstCode || "未読込";

  document.getElementById("secondDisplay").textContent =
    secondCode || "未読込";
}

/* ===== カメラ ===== */
const video = document.getElementById("v");

async function scan() {
  if (scanning || scanStarting) return;

  scanStarting = true;
  detected = false;

  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        "カメラを利用できません。HTTPS接続を確認してください。"
      );
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ zoom: 2 }]
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    scanning = true;
    requestAnimationFrame(scanLoop);

  } catch (err) {
    stopCamera();
    alert("カメラ起動失敗: " + err.message);
  } finally {
    scanStarting = false;
  }
}

function scanLoop() {
  if (!scanning || detected) return;

  if (!video.videoWidth || !video.videoHeight) {
    requestAnimationFrame(scanLoop);
    return;
  }

  const frame =
    document.getElementById("scan-frame").getBoundingClientRect();

  const rect = video.getBoundingClientRect();

  const scaleX = video.videoWidth / rect.width;
  const scaleY = video.videoHeight / rect.height;

  const sx = Math.max(0, (frame.left - rect.left) * scaleX);
  const sy = Math.max(0, (frame.top - rect.top) * scaleY);

  const sw = Math.min(
    frame.width * scaleX,
    video.videoWidth - sx
  );

  const sh = Math.min(
    frame.height * scaleY,
    video.videoHeight - sy
  );

  if (sw <= 0 || sh <= 0) {
    requestAnimationFrame(scanLoop);
    return;
  }

  const canvas = document.createElement("canvas");

  canvas.width = Math.max(1, Math.floor(sw));
  canvas.height = Math.max(1, Math.floor(sh));

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  ctx.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  const image = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const qr = jsQR(
    image.data,
    canvas.width,
    canvas.height
  );

  if (qr && qr.data) {
    detected = true;
    stopCamera();
    handleScan(qr.data);
  } else {
    requestAnimationFrame(scanLoop);
  }
}

function stopCamera() {
  scanning = false;

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => {
      track.stop();
    });
  }

  video.srcObject = null;
}

/* ===== 照合用文字列の抽出 ===== */
function makeCompareCode(code) {
  // 28文字目～50文字目を抽出
  // substringは0始まりなので (27, 50)
  if (code.length < 50) {
    return null;
  }

  return code.substring(27, 50);
}

/* ===== QR判定 ===== */
async function handleScan(code) {
  playSound("read");

  /* ===== 1枚目 ===== */
  if (step === 1) {
    firstCode = code;
    secondCode = "";

    updateDisplay();

    setStatus(
      "基準QR登録完了。2枚目のQRコードを読み込んでください"
    );

    step = 2;
    return;
  }

  /* ===== 2枚目 ===== */
  if (step === 2) {
    secondCode = code;

    updateDisplay();

    // 1枚目と2枚目の28～50文字目を抽出
    const firstCompare = makeCompareCode(firstCode);
    const secondCompare = makeCompareCode(secondCode);

    // 両方の抽出結果が有効で、完全一致した場合のみOK
    const ok =
      firstCompare !== null &&
      secondCompare !== null &&
      firstCompare === secondCompare;

    if (ok) {
      setStatus("✔ QRコード一致（28～50文字目）", "ok");
      playSound("success");
    } else {
      setStatus("❌ QRコード不一致（28～50文字目）", "ng");
      playSound("error");
    }

    try {
      await saveResult(
        firstCode,
        secondCode,
        ok ? "OK" : "NG"
      );

      await loadHistory();
    } catch (err) {
      console.error("検品結果の保存エラー:", err);

      setStatus(
        (ok ? "✔ QRコード一致" : "❌ QRコード不一致") +
        "（履歴保存失敗）",
        ok ? "ok" : "ng"
      );
    }

    /* 次回も同じ1枚目を使用 */
    setTimeout(() => {
      secondCode = "";

      updateDisplay();

      setStatus(
        "続けて検品できます。「QRコードを読み取る」を押してください"
      );

      step = 2;
    }, 1500);
  }
}

/* ===== DB保存 ===== */
async function saveResult(first, second, result) {
  await dbPromise;

  return new Promise((resolve, reject) => {
    const tx = db.transaction("checks", "readwrite");

    tx.objectStore("checks").add({
      time: new Date().toLocaleString("ja-JP"),
      first,
      second,
      result
    });

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

/* ===== 履歴 ===== */
async function loadHistory() {
  await dbPromise;

  return new Promise((resolve, reject) => {
    const tx = db.transaction("checks", "readonly");
    const request = tx.objectStore("checks").getAll();

    request.onsuccess = () => {
      const table = document.getElementById("history");

      table.innerHTML = `
        <tr>
          <th>時刻</th>
          <th>1枚目</th>
          <th>2枚目</th>
          <th>結果</th>
        </tr>
      `;

      request.result.reverse().slice(0, 10).forEach(record => {
        const row = table.insertRow();

        [
          record.time,
          record.first,
          record.second,
          record.result
        ].forEach(value => {
          const cell = row.insertCell();
          cell.textContent = value ?? "";
        });
      });

      resolve();
    };

    request.onerror = () => reject(request.error);
  });
}

/* ===== リセット ===== */
function resetAll() {
  step = 1;

  firstCode = "";
  secondCode = "";

  updateDisplay();

  setStatus("1枚目のQRコードを読み込んでください");

  stopCamera();
}

/* ===== CSV ===== */
async function exportCSV() {
  try {
    await dbPromise;

    const tx = db.transaction("checks", "readonly");
    const request = tx.objectStore("checks").getAll();

    request.onsuccess = () => {
      const records = request.result;

      const rows = [
        ["時刻", "1枚目", "2枚目", "結果"],
        ...records.map(record => [
          record.time,
          record.first,
          record.second,
          record.result
        ])
      ];

      const escapeCSV = value => {
        const text = String(value ?? "");
        return '"' + text.replace(/"/g, '""') + '"';
      };

      const csv = "\uFEFF" + rows
        .map(row => row.map(escapeCSV).join(","))
        .join("\r\n");

      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "QR照合履歴.csv";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    request.onerror = () => {
      alert("CSVデータの読み込みに失敗しました。");
    };

  } catch (err) {
    console.error(err);
    alert("CSV出力に失敗しました。");
  }
}

/* ===== ボタン ===== */
document.getElementById("scanBtn").onclick = async () => {
  try {
    await dbPromise;
    await initAudio();
  } catch (err) {
    console.error(err);

    alert(
      "初期化に失敗しました。音声ファイルや保存先を確認してください。\n" +
      err.message
    );

    return;
  }

  scan();
};

document.getElementById("resetBtn").onclick = resetAll;
document.getElementById("exportBtn").onclick = exportCSV;

/* ===== スリープ復帰 ===== */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    audioReady = false;
    soundBuffers = {};

    try {
      await initAudio();
    } catch (err) {
      console.error("音声復帰エラー:", err);
    }
  } else {
    stopCamera();
  }
});

/* ===== Service Worker ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .catch(err => {
      console.error("Service Worker登録エラー:", err);
    });
}
</script>

</body>
</html>
