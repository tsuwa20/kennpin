
<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="icon/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta charset="UTF-8" />
<title>QRコード検品Ver.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
  margin-bottom: 80px;
}

#status {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 20px;
}

.ok { background: green; color: white; }
.ng { background: red; color: white; }
.normal { background: #e5e5e5; color: #0066cc; }

button {
  width: 100%;
  font-size: 20px;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

th, td {
  border-bottom: 1px solid #ddd;
  padding: 6px;
  overflow-wrap: anywhere;
}

#video-container {
  position: relative;
  width: 100%;
  max-width: 400px;
  margin: auto;
}

video {
  width: 100%;
  border-radius: 10px;
}

#scan-frame {
  width: 220px;
  height: 220px;
  border: 3px solid rgba(255,0,0,0.8);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  border-radius: 10px;
  box-sizing: border-box;
}

.navbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #f3f3f3;
  border-top: 2px solid #ccc;
  display: flex;
  justify-content: space-around;
}

.navbar a {
  flex: 1;
  text-align: center;
  padding: 15px 0;
  font-size: 15px;
  text-decoration: none;
  color: #333;
}

.navbar a.active {
  background: #0078ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>QRコード検品</h2>

<div id="status" class="normal">
  現品票のQRを読み込んでください
</div>

<div id="video-container">
  <video id="v" autoplay playsinline></video>
  <div id="scan-frame"></div>
</div>

<button id="scanBtn">📷 QRコードを読み取る</button>
<button id="resetBtn">🔄 最初に戻る</button>
<button id="exportBtn">📁 CSV出力</button>

<h3>履歴</h3>
<table id="history"></table>

<div class="navbar">
  <a href="index.html" class="active">📷 QR検品</a>
  <a href="tenyuryoku.html">⌨ 手入力検品</a>
  <a href="scan.html">🏷️ 海外ラベル</a>
  <a href="gennpin.html">🎟️ 現品票検品</a>
</div>

<script src="js/jsQR.js"></script>

<script>
let step = 1;

// 1回目のQRコード（元データ）
let firstCode1 = "";

// 1回目のQRコード（空白除去後）
let firstCodeNormalized = "";

let scanning = false;
let detected = false;

/* ===== AudioContext管理 ===== */
let audioCtx;
let soundBuffers = {};
let audioReady = false;

async function initAudio() {
  if (!audioCtx) {
    audioCtx = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }

  if (audioReady) return;

  const files = {
    read: "sounds/yomitori.mp3",
    success: "sounds/seikou.mp3",
    error: "sounds/keikoku.mp3"
  };

  for (const key in files) {
    const res = await fetch(files[key]);

    if (!res.ok) {
      throw new Error("音声ファイルの読み込みに失敗: " + files[key]);
    }

    const arrayBuffer = await res.arrayBuffer();
    soundBuffers[key] =
      await audioCtx.decodeAudioData(arrayBuffer);
  }

  audioReady = true;
}

function playSound(type) {
  if (!audioReady || !soundBuffers[type]) return;

  const src = audioCtx.createBufferSource();
  src.buffer = soundBuffers[type];
  src.connect(audioCtx.destination);
  src.start(0);
}

/* ===== IndexedDB ===== */
let db;

const req = indexedDB.open("checksDB", 1);

req.onupgradeneeded = e => {
  db = e.target.result;

  if (!db.objectStoreNames.contains("checks")) {
    db.createObjectStore("checks", {
      keyPath: "id",
      autoIncrement: true
    });
  }
};

req.onsuccess = e => {
  db = e.target.result;
  loadHistory();
};

req.onerror = () => {
  setStatus("履歴データベースを開けません", "ng");
};

function setStatus(text, type = "normal") {
  const s = document.getElementById("status");
  s.textContent = text;
  s.className = type;
}

const video = document.getElementById("v");

/* ===== カメラ起動 ===== */
async function scan() {
  if (scanning) return;

  scanning = true;
  detected = false;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ zoom: 2 }]
      }
    });

    if (!scanning) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    video.srcObject = stream;
    await video.play();

    requestAnimationFrame(scanLoop);

  } catch (err) {
    scanning = false;
    setStatus("カメラを起動できません。設定を確認してください", "ng");
    console.error(err);
  }
}

/* ===== スキャン ===== */
function scanLoop() {
  if (!scanning || detected) return;

  if (!video.videoWidth || !video.videoHeight) {
    requestAnimationFrame(scanLoop);
    return;
  }

  const frame = document.getElementById("scan-frame")
    .getBoundingClientRect();

  const rect = video.getBoundingClientRect();

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(frame.width);
  canvas.height = Math.round(frame.height);

  const ctx = canvas.getContext("2d");

  const scaleX = video.videoWidth / rect.width;
  const scaleY = video.videoHeight / rect.height;

  ctx.drawImage(
    video,
    (frame.left - rect.left) * scaleX,
    (frame.top - rect.top) * scaleY,
    frame.width * scaleX,
    frame.height * scaleY,
    0, 0, canvas.width, canvas.height
  );

  const img = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const qr = jsQR(img.data, canvas.width, canvas.height);

  if (qr) {
    detected = true;
    stopCamera();
    handleScan(qr.data);
  } else {
    requestAnimationFrame(scanLoop);
  }
}

function stopCamera() {
  scanning = false;

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }

  video.srcObject = null;
}

/* ===== 空白除去 ===== */
function normalizeCode(code) {
  // 半角スペース、全角スペース、タブ、改行などを除去
  return code.replace(/\s/g, "");
}


/* ===== 判定 ===== */
function handleScan(code) {
  playSound("read");

  if (step === 1) {
    // 1回目：現品票のQRコードを読み取る
    if (code.length < 29) {
      setStatus("バーコードが短すぎます", "ng");
      playSound("error");
      return;
    }

    // 元データを保存
    firstCode1 = code;

    // 空白をすべて除去したデータを作成
    firstCodeNormalized = normalizeCode(code);

    setStatus("パーツラベルのQRコードを読んでください");
    step = 2;
    return;
  }

  if (step === 2) {
    // 2回目のQRコード全体から空白を除去
    const secondCodeNormalized = normalizeCode(code);

    // 1回目と2回目の全データが同じか判定
    const duplicate =
      firstCodeNormalized === secondCodeNormalized;

    if (duplicate) {
      // 重複エラー
      setStatus("⚠ 重複エラーです", "ng");
      playSound("error");

      saveResult(
        firstCode1,
        code,
        "重複"
      );

      loadHistory();
      return;
    }

    // 2回目：34文字目以降を取得
    const secondCode = code.substring(33);

    // 取得部分から空白をすべて除去
    const secondPartNormalized = normalizeCode(secondCode);

    // 1回目のデータに含まれるか判定
    const ok =
      secondPartNormalized.length > 0 &&
      firstCodeNormalized.includes(secondPartNormalized);

    if (ok) {
      setStatus("✔ 一致しました！", "ok");
      playSound("success");
    } else {
      setStatus("❌ 不一致です", "ng");
      playSound("error");
    }

    // 履歴に保存
    saveResult(
      firstCode1,
      secondCode,
      ok ? "OK" : "NG"
    );

    loadHistory();
  }
}


/* ===== DB保存 ===== */
function saveResult(first, second, result) {
  if (!db) {
    console.error("データベースが準備できていません");
    return;
  }

  const tx = db.transaction("checks", "readwrite");

  tx.objectStore("checks").add({
    time: new Date().toLocaleString(),
    first,
    second,
    result
  });
}

/* ===== 履歴表示 ===== */
function loadHistory() {
  if (!db) return;

  const tx = db.transaction("checks", "readonly");
  const request = tx.objectStore("checks").getAll();

  request.onsuccess = () => {
    const table = document.getElementById("history");
    table.replaceChildren();

    const header = document.createElement("tr");

    ["時刻", "1回目", "2回目", "結果"].forEach(label => {
      const th = document.createElement("th");
      th.textContent = label;
      header.appendChild(th);
    });

    table.appendChild(header);

    request.result.reverse().slice(0, 5).forEach(r => {
      const tr = document.createElement("tr");

      [r.time, r.first, r.second, r.result].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      });

      table.appendChild(tr);
    });
  };
}

/* ===== リセット ===== */
function resetAll() {
  stopCamera();

  step = 1;
  firstCode1 = "";
  firstCodeNormalized = "";
  detected = false;

  setStatus("現品票のQRを読み込んでください");
}

/* ===== CSV出力 ===== */
function exportCSV() {
  if (!db) {
    setStatus("データベースが準備できていません", "ng");
    return;
  }

  const tx = db.transaction("checks", "readonly");
  const request = tx.objectStore("checks").getAll();

  request.onsuccess = () => {
    let csv = "時刻,1回目,2回目,結果\n";

    const escapeCSV = value =>
      '"' + String(value ?? "").replace(/"/g, '""') + '"';

    request.result.forEach(r => {
      csv += [
        r.time,
        r.first,
        r.second,
        r.result
      ].map(escapeCSV).join(",") + "\n";
    });

    const blob = new Blob(
      ["\uFEFF" + csv],
      { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "検品履歴.csv";
    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
}

/* ===== イベント ===== */
document.getElementById("scanBtn").onclick = async () => {
  try {
    await initAudio();
    await scan();
  } catch (err) {
    setStatus("初期化に失敗しました。音声ファイルを確認してください", "ng");
    console.error(err);
  }
};

document.getElementById("resetBtn").onclick = resetAll;
document.getElementById("exportBtn").onclick = exportCSV;

/* ===== スリープ復帰対策 ===== */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    if (audioCtx && audioCtx.state === "suspended") {
      try {
        await audioCtx.resume();
      } catch (err) {
        console.error(err);
      }
    }
  } else {
    stopCamera();
  }
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
